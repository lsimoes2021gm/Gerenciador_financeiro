

services:
  postgres:
    image: postgres:15-alpine
    container_name: financeiro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: meu_financeiro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - financeiro-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financeiro-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@financeiro.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - financeiro-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  financeiro-network:
    driver: bridge