<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor Financeiro & Patrimonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e4e8ef; --line2:#eef1f6;
  --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
  --side:#0b1220; --side2:#111a2e; --sidetext:#cbd5e1; --sidemuted:#64748b;
  --acc:#2f5bea; --acc2:#e8eefe; --pos:#0f9f6e; --pos2:#e6f6f0; --neg:#e0453a; --neg2:#fdeceb; --warn:#d48806; --warn2:#fdf4e3; --info:#0e7490; --info2:#e6f4f7;
  --r:10px; --sh:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
}
[data-theme=dark]{
  --bg:#0a0f1c; --panel:#111827; --panel2:#0f172a; --line:#1f2a3d; --line2:#18223a;
  --text:#e5e7eb; --muted:#94a3b8; --faint:#64748b; --side:#070b15; --side2:#0e1626;
  --acc:#5b82ff; --acc2:#17234a; --pos:#34d399; --pos2:#0d2a22; --neg:#f87171; --neg2:#2d1416; --warn:#fbbf24; --warn2:#2a2210; --info:#22d3ee; --info2:#0b2730;
  --sh:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;-webkit-font-smoothing:antialiased}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* sidebar */
#side{background:var(--side);color:var(--sidetext);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 18px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1a2438}
.brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2f5bea,#0f9f6e);display:grid;place-items:center;color:#fff;font-weight:700}
.brand b{display:block;color:#fff;font-size:14px}.brand small{color:var(--sidemuted);font-size:11px}
.navg{padding:12px 10px 4px}.navg>div{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sidemuted);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--sidetext);text-decoration:none;cursor:pointer;font-size:13px}
.nav:hover{background:var(--side2);color:#fff}.nav.on{background:#1b2a4d;color:#fff}
.nav svg{width:16px;height:16px;flex:none;opacity:.85}.nav .bdg{margin-left:auto;background:var(--neg);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 6px}
.sidefoot{margin-top:auto;padding:12px 16px;border-top:1px solid #1a2438;font-size:11.5px;color:var(--sidemuted)}
.sidefoot .who{display:flex;gap:8px;align-items:center;color:var(--sidetext);margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}.dot.ok{background:#22c55e}.dot.loc{background:#f59e0b}
/* main */
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#top{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px;flex:none}
#top h1{font-size:16px;margin:0;font-weight:600;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{overflow-y:auto;padding:22px;flex:1}
.ctl{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;outline:none}
input[type=date].ctl,input[type=month].ctl{cursor:pointer}[data-theme=dark] input::-webkit-calendar-picker-indicator{filter:invert(1)}input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.75}
.ctl:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.mnav{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);height:34px}
.mnav button{border:0;background:none;width:30px;height:32px;cursor:pointer;color:var(--muted)}.mnav span{min-width:64px;white-space:nowrap;text-align:center;font-weight:500}
.btn{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel2)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}.btn.ghost{border-color:transparent;background:none}.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:34px;padding:0;justify-content:center}
/* layout */
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:span 3}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:0}
.card>.hd{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.card>.hd h3{margin:0;font-size:13.5px;font-weight:600;margin-right:auto}.card>.hd small{color:var(--muted)}
.card>.bd{padding:16px}.card>.bd.p0{padding:0}
.kpi{padding:15px 16px}.kpi .l{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:6px}.kpi .v{font-size:21px;font-weight:650;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mut{color:var(--muted)}.fnt{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.pos{background:var(--pos2);border-color:transparent}.chip.neg{background:var(--neg2);border-color:transparent}.chip.warn{background:var(--warn2);border-color:transparent}.chip.info{background:var(--info2);color:var(--info);border-color:transparent}.chip.acc{background:var(--acc2);color:var(--acc);border-color:transparent}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .sp{flex:1}
.chart{position:relative;height:260px}.chart.sm{height:200px}.chart.lg{height:320px}
/* tables */
table.t{width:100%;border-collapse:collapse}
.t th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:hover td{background:var(--panel2)}.t .n{text-align:right;white-space:nowrap}
.t tr.tot td{font-weight:650;background:var(--panel2);border-top:1px solid var(--line)}
.t tr.sub td{font-weight:600}.t tr.grp td{background:var(--panel2);font-weight:600;font-size:12px}
.t td.act{text-align:right;white-space:nowrap;width:1%}
.tw{overflow:auto;max-height:620px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.bar{height:7px;background:var(--line2);border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar>i.pos{background:var(--pos)}.bar>i.warn{background:var(--warn)}.bar>i.neg{background:var(--neg)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line2)}.list .it:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;flex:none}
.grow{flex:1;min-width:0}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);align-items:flex-start}
.alert .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.alert.danger .ic{background:var(--neg2);color:var(--neg)}.alert.warning .ic{background:var(--warn2);color:var(--warn)}.alert.info .ic{background:var(--info2);color:var(--info)}
.banner{padding:9px 14px;border-radius:8px;background:var(--warn2);color:var(--warn);margin-bottom:14px;font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}.tabs button.on{color:var(--acc);border-color:var(--acc)}
.ccard{border-radius:12px;padding:16px;color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.ccard:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.ccard .nm{font-weight:600}.ccard .lim{font-size:20px;font-weight:650}
/* modal */
#modal{position:fixed;inset:0;background:rgba(2,6,23,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
#modal.on{display:flex}
.mdl{background:var(--panel);border-radius:12px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mdl.wide{width:min(980px,100%)}
.mdl .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.mdl .mh h2{font-size:15px;margin:0;margin-right:auto}
.mdl .mb{padding:18px 20px}.mdl .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px 12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 6}.f.w3{grid-column:span 3}.f.w1{grid-column:span 1}.f.w2{grid-column:span 2}.f.w4{grid-column:span 4}
.f label{font-size:12px;color:var(--muted);font-weight:500}.f .ctl{width:100%}.f textarea.ctl{height:70px;padding:8px 10px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;background:var(--panel);padding:8px;cursor:pointer;font-weight:500}.seg button+button{border-left:1px solid var(--line)}
.seg button.on.R{background:var(--pos2);color:var(--pos)}.seg button.on.D{background:var(--neg2);color:var(--neg)}.seg button.on.T{background:var(--acc2);color:var(--acc)}
.hint{font-size:11.5px;color:var(--muted)}
#toast{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
#toast div{background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:360px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:4px}
.msg{padding:10px 13px;border-radius:10px;max-width:88%;white-space:pre-wrap;line-height:1.5}.msg.u{background:var(--acc);color:#fff;align-self:flex-end}.msg.a{background:var(--panel2);border:1px solid var(--line);align-self:flex-start}
.integ{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}.integ:last-child{border-bottom:0}
.integ .lg{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}.kv span:nth-child(odd){color:var(--muted)}
.ind{padding:15px 16px}.ind .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.ind .v{font-size:22px;font-weight:650;margin:8px 0 6px}.ind p{margin:8px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
@media (max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.s3,.s2{grid-column:auto}}
@media (max-width:820px){#app{grid-template-columns:1fr}#side{display:none}#side.open{display:flex;position:fixed;inset:0 22% 0 0;z-index:40;box-shadow:0 0 0 100vmax rgba(2,6,23,.45)}.g2{grid-template-columns:1fr}#top{padding:0 12px}#view{padding:14px}#menuBtn{display:inline-flex!important}.f.w3,.f.w4{grid-column:span 6}.f.w2,.f.w1{grid-column:span 3}.mdl .mb,.mdl .mh,.mdl .mf{padding-left:14px;padding-right:14px}#modal{padding:12px 8px}.hide-m{display:none!important}}
</style>
</head>
<body>
<div id="loading"><div><div class="spin"></div>Conectando ao banco de dados…</div></div>
<div id="app">
  <aside id="side"></aside>
  <main id="main">
    <header id="top">
      <button class="btn ib" id="menuBtn" style="display:none" aria-label="Menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <select class="ctl hide-m" id="entSel" title="Consolidação"></select>
      <div class="mnav"><button id="mPrev" aria-label="Mês anterior">‹</button><span id="mLbl"></span><button id="mNext" aria-label="Próximo mês">›</button></div>
      <button class="btn ib hide-m" id="themeBtn" title="Tema">◐</button>
      <button class="btn pri" id="quickAdd">+<span class="hide-m">&nbsp;Lançamento</span></button>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="core.js"></script>
<script src="views.js"></script>
</body>
</html>
